<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ناشر رادار پرداخت</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      background: #f3f4f6;
      color: #111827;
    }

    .container {
      max-width: 700px;
      margin: auto;
      padding: 20px;
    }

    .header {
      background: #111827;
      color: white;
      border-radius: 20px;
      padding: 24px;
      margin-bottom: 16px;
    }

    .header h1 {
      margin: 0 0 8px;
      font-size: 24px;
    }

    .header p {
      margin: 0;
      opacity: .7;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 5px 20px rgba(0,0,0,.05);
    }

    .field {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
    }

    textarea,
    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-family: inherit;
      font-size: 15px;
      outline: none;
    }

    textarea {
      min-height: 150px;
      resize: vertical;
    }

    input:focus,
    textarea:focus {
      border-color: #111827;
    }

    button {
      width: 100%;
      padding: 15px;
      border: 0;
      border-radius: 13px;
      font-family: inherit;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .preview-btn {
      background: #e5e7eb;
      color: #111827;
      margin-top: 5px;
    }

    .publish-btn {
      background: #111827;
      color: white;
      margin-top: 10px;
    }

    .publish-btn:disabled {
      opacity: .5;
    }

    .preview {
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      padding: 16px;
      min-height: 100px;
      white-space: pre-wrap;
      line-height: 1.8;
    }

    #imagePreview {
      width: 100%;
      max-height: 350px;
      object-fit: contain;
      border-radius: 12px;
      margin-top: 12px;
      display: none;
    }

    .status {
      display: none;
      margin-top: 14px;
      padding: 12px;
      border-radius: 12px;
      text-align: center;
    }

    .hint {
      color: #777;
      font-size: 12px;
      margin-top: 6px;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>ناشر رادار پرداخت</h1>
    <p>ویژه اعضای کانال رادار پرداخت</p>
  </div>

  <div class="card">

    <div class="field">
      <label>متن پست</label>

      <textarea
        id="postText"
        placeholder="متن پست را بنویسید..."></textarea>
    </div>

    <div class="field">
      <label>عکس / اسکرین‌شات</label>

      <input
        type="file"
        id="imageInput"
        accept="image/*">

      <img id="imagePreview">
    </div>

    <div class="field">
      <label>لینک اپ</label>

      <input
        type="url"
        id="appLink"
        placeholder="https://...">

      <div class="hint">
        لینک اپ در انتهای پست قرار می‌گیرد.
      </div>
    </div>

    <button
      class="preview-btn"
      onclick="showPreview()">
      👁️ پیش‌نمایش
    </button>

  </div>


  <div class="card">

    <label>پیش‌نمایش</label>

    <div id="preview" class="preview">
      هنوز چیزی وارد نشده است.
    </div>

  </div>


  <div class="card">

    <button
      id="publishBtn"
      class="publish-btn"
      onclick="publishPost()">
      📤 انتشار در کانال
    </button>

    <div
      id="status"
      class="status">
    </div>

  </div>

</div>


<script>

const BACKEND_URL =
  "https://telegram-publisher-namdarenbatm-7656s-projects.vercel.app/api/publish";


const imageInput =
  document.getElementById("imageInput");

const imagePreview =
  document.getElementById("imagePreview");


imageInput.addEventListener("change", function () {

  const file = this.files[0];

  if (!file) {
    imagePreview.style.display = "none";
    return;
  }

  const reader = new FileReader();

  reader.onload = function(e) {

    imagePreview.src = e.target.result;
    imagePreview.style.display = "block";

  };

  reader.readAsDataURL(file);

});


function getPostText() {

  const text =
    document.getElementById("postText").value.trim();

  const link =
    document.getElementById("appLink").value.trim();

  let result = text;

  if (link) {

    result +=
      "\n\n🔗 ورود به اپ:\n" +
      link;

  }

  return result;

}


function showPreview() {

  const text = getPostText();

  const preview =
    document.getElementById("preview");

  if (!text) {

    preview.textContent =
      "لطفاً متن پست را وارد کنید.";

    return;
  }

  preview.textContent = text;

}


async function publishPost() {

  const text = getPostText();

  if (!text) {

    showStatus(
      "لطفاً متن پست را وارد کنید.",
      false
    );

    return;
  }


  const button =
    document.getElementById("publishBtn");

  const image =
    imageInput.files[0];


  button.disabled = true;

  button.textContent =
    "⏳ در حال انتشار...";


  try {

    const formData =
      new FormData();

    formData.append(
      "text",
      text
    );


    if (image) {

      formData.append(
        "image",
        image
      );

    }


    const response =
      await fetch(
        BACKEND_URL,
        {
          method: "POST",
          body: formData
        }
      );


    const result =
      await response.json();


    if (!response.ok) {

      throw new Error(
        result.message ||
        "خطا در انتشار"
      );

    }


    showStatus(
      "✅ پست با موفقیت در کانال منتشر شد.",
      true
    );


  } catch (error) {

    console.error(error);

    showStatus(
      "❌ انتشار انجام نشد: " +
      error.message,
      false
    );

  }


  button.disabled = false;

  button.textContent =
    "📤 انتشار در کانال";

}


function showStatus(
  message,
  success
) {

  const status =
    document.getElementById("status");

  status.textContent =
    message;

  status.style.display =
    "block";

  status.style.background =
    success
      ? "#dcfce7"
      : "#fee2e2";

  status.style.color =
    success
      ? "#166534"
      : "#991b1b";

}

</script>

</body>
</html>
